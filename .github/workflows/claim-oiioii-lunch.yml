name: Claim OiiOii daily lunch

on:
  schedule:
    # OiiOii daily 盒飯 refreshes at UTC 00:00. Run shortly after.
    # 00:10 UTC = 08:10 Asia/Taipei
    - cron: '10 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  claim:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        account: [1, 2, 3]
    env:
      OII_ACCOUNT_NAME: ${{ matrix.account }}
      OII_STORAGE_STATE_B64: ${{ secrets[format('OII_STORAGE_STATE_B64_{0}', matrix.account)] }}
      OII_COOKIE: ${{ secrets[format('OII_COOKIE_{0}', matrix.account)] }}
      OII_MAX_RETRIES: '3'
      OII_SCREENSHOT_DIR: './screenshots'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Claim daily 盒飯
        run: |
          if [ -z "$OII_STORAGE_STATE_B64" ] && [ -z "$OII_COOKIE" ]; then
            echo "Account $OII_ACCOUNT_NAME is not configured; skipping."
            exit 0
          fi
          npm run claim

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oiioii-screenshots-account-${{ matrix.account }}-${{ github.run_id }}
          path: screenshots/
          retention-days: 7
          if-no-files-found: ignore
